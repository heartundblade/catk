# Training Configuration for Diffusion-Planner

# # Basic Settings
# name: "diffusion-planner-training"
# save_dir: "."

# Data Settings
train_set: null
train_set_list: null
future_len: 80
time_len: 21
agent_state_dim: 11
agent_num: 64
static_objects_state_dim: 10
static_objects_num: 5
lane_len: 20
lane_state_dim: 12
lane_num: 70
# route_len: 20
# route_state_dim: 12
# route_num: 25

# DataLoader Parameters
augment_prob: 0.5
normalization_file_path: "normalization.json"
use_data_augment: true
num_workers: 4
pin_mem: true

# Training Parameters
seed: 3407
train_epochs: 500
save_utd: 20
batch_size: 2048
learning_rate: 5e-4
warm_up_epoch: 5
encoder_drop_path_rate: 0.1
decoder_drop_path_rate: 0.1
alpha_planning_loss: 1.0
device: "cuda"
use_ema: true

# Model Parameters
encoder_depth: 3
decoder_depth: 3
num_heads: 6
hidden_dim: 192
diffusion_model_type: "x_start"

# Decoder Parameters
predicted_neighbor_num: 10
resume_model_path: null
