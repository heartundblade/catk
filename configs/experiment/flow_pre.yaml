
# @package _global_

defaults:
  - override /trainer: ddp
  - override /model: flow_dp

trainer:
  max_epochs: 32
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0

data:
  val_gt_scenario_dir: null
  train_batch_size: 14
  val_batch_size: 14

model:
  config:
    learning_rate: 5e-4
    train_epochs: 32
    train_predictor: false
    val_closed_loop: false
    fast_wosac_metric: false